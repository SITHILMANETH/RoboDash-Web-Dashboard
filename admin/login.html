<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>RoboDash · Sign in</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="login-wrap">
    <main class="login">
      <h1>RoboDash Control</h1>
      <p class="sub">Sign in with Google to manage the live dashboard.</p>
      <div class="err" id="err" hidden></div>
      <div id="g_id_onload"
        data-auto_prompt="false"
        data-callback="handleCredentialResponse"
        data-client_id="794264608590-t0d3n6uu510bgq7i719amqmbjvnn03ch.apps.googleusercontent.com"></div>
      <div class="g_id_signin" data-theme="filled_black" data-size="large" data-width="320"></div>
    </main>
  </div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/admin/login.js"></script>
</body>
</html>
